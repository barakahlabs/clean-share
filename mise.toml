[tools]
# Pinned so CI (.github/workflows/ci.yml) and every machine build with the same versions.
node = "26"
pnpm = "12"
# Major version only: mise installs the newest Corretto 21, and Renovate offers only new majors
# (corretto-25), in the same form. A full version gets Renovate updates mise can't install.
java = "corretto-21"
# A full version, so a new Rust release can't break CI before we choose to update (1.100.0 can't
# build turso_core 0.8.3: tursodatabase/turso#9463). mise installs it through rustup. The targets
# are the ones the Android (ci.yml) and iOS simulator (ios.yml) builds compile for.
rust = { version = "1.99.1", components = "clippy", targets = "aarch64-linux-android,aarch64-apple-ios-sim" }
# Android command-line tools only; SDK packages come from `mise run android:sdk`.
android-sdk = "23.0"

[env]
# Tauri Android needs NDK_HOME. Keep the NDK version in sync with the android:sdk task.
NDK_HOME = "{{env.HOME}}/.local/share/mise/installs/android-sdk/23.0/ndk/30.0.16248370"

[tasks."android:sdk"]
description = "Install the Android SDK packages the app builds with (platform 37, NDK 30)"
run = [
  "yes | sdkmanager --licenses > /dev/null",
  'sdkmanager --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"',
]
