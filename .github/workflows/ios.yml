name: iOS

# Manual only: Actions → iOS → Run workflow (pick the branch to build).
# Runs on GitHub's standard macOS runners, free for public repos (an M1 with 3 cores, slower than
# Blacksmith's). If this repo ever goes private, macOS minutes cost money on GitHub too.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Everything that doesn't need a Mac runs on Linux; the Mac only compiles the iOS side.
  frontend:
    name: Frontend (Linux)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  simulator:
    name: Simulator build (macOS)
    needs: frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Built on Linux; the Rust code embeds it at compile time (frontendDist: ../dist).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: dist

      # Node and pnpm only: the Tauri CLI is an npm package and drives Xcode's Rust build step.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node pnpm

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios-sim
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ios

      - run: pnpm install --frozen-lockfile

      # Simulator builds are signed "to run locally" (ad hoc), so no certificate or Apple account
      # is needed. The empty beforeBuildCommand skips rebuilding the frontend on the Mac.
      - name: Build for the iOS simulator (arm64)
        run: >-
          pnpm tauri ios build --debug --target aarch64-sim --ci
          --config '{"build":{"beforeBuildCommand":""}}'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clean-share-ios-simulator-app
          path: src-tauri/gen/apple/build/arm64-sim/
          retention-days: 7
          if-no-files-found: error
