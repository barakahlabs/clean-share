[package]
name = "bookmarks"
version = "0.1.0"
description = "Clean Share bookmarks: storage, tags and search in one database per user"
edition = "2024"
license = "MIT"

[dependencies]
# Import: Pocket and Raindrop CSV exports.
csv = "1"
link-cleaner = { path = "../link-cleaner" }
tag-suggest = { path = "../tag-suggest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# No mimalloc: a library shouldn't replace the app's allocator.
turso = { version = "=0.8.3", default-features = false, features = ["fts"] }
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
