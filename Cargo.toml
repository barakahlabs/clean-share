# One workspace for the app, the crates and the plugin: one Cargo.lock and one target/, so shared
# dependencies (Tauri, Turso, reqwest, …) are built once instead of once per crate.
[workspace]
resolver = "3"
members = ["src-tauri", "crates/*", "plugins/share-target"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
