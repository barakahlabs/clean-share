[package]
name = "clean-share"
version = "0.1.0"
description = "Clean Share: remove tracking from shared links"
authors = ["Sirajul Muneer"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clean_share_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Import: the system file picker, and reading what it returns (Android content:// URIs too).
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Copy the cleaned link; Paste on the Clean tab.
tauri-plugin-clipboard-manager = "2"
tauri-plugin-share-target = { path = "../plugins/share-target" }
link-cleaner = { path = "../crates/link-cleaner" }
bookmarks = { path = "../crates/bookmarks" }
link-preview = { path = "../crates/link-preview" }
link-rules = { path = "../crates/link-rules" }
rules-update = { path = "../crates/rules-update" }
sys-locale = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
